<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LED Control</title>
  <style>
    body {
      background: #1f3b44;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }

    .card {
      background: #2f4f58;
      padding: 40px;
      border-radius: 20px;
      width: 300px;
      text-align: center;
      color: white;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    h1 {
      margin-bottom: 20px;
    }

    #status {
      font-size: 22px;
      margin-bottom: 20px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 60px;
      height: 34px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 26px;
      width: 26px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #4CAF50;
    }

    input:checked + .slider:before {
      transform: translateX(26px);
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>LED Control</h1>
    <div id="status">OFF</div>

    <label class="switch">
      <input type="checkbox" id="toggle">
      <span class="slider"></span>
    </label>
  </div>

  <script>
    const toggle = document.getElementById("toggle");
    const statusText = document.getElementById("status");

    const SERVER_URL = "https://led-server-production.up.railway.app";

    // Get current LED state
    fetch(`${SERVER_URL}/get-led`)
      .then(res => res.json())
      .then(data => {
        if (data.led === "ON") {
          toggle.checked = true;
          statusText.innerText = "ON";
        }
      });

    // Toggle LED
    toggle.addEventListener("change", () => {
      const state = toggle.checked ? "ON" : "OFF";
      statusText.innerText = state;

      fetch(`${SERVER_URL}/update-led?led=${state}`);
    });
  </script>

</body>
</html>
