<!DOCTYPE html>
<html>
<head>
  <title>LED Control</title>
  <style>
    body {
      background: #1e2f36;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial;
      color: white;
    }
    .card {
      background: #2e4753;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      width: 300px;
    }
    .switch {
      width: 60px;
      height: 30px;
      background: gray;
      border-radius: 30px;
      position: relative;
      cursor: pointer;
      margin: auto;
    }
    .circle {
      width: 26px;
      height: 26px;
      background: white;
      border-radius: 50%;
      position: absolute;
      top: 2px;
      left: 2px;
      transition: 0.3s;
    }
    .on {
      background: #00c853;
    }
    .on .circle {
      left: 32px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>LED Control</h2>
    <h3 id="status">OFF</h3>
    <div class="switch" id="toggle" onclick="toggleLED()">
      <div class="circle"></div>
    </div>
  </div>

<script>
async function loadLED() {
  const res = await fetch("/get-led");
  const data = await res.json();
  updateUI(data.led);
}

async function toggleLED() {
  const newState = document.getElementById("status").innerText === "OFF" ? "ON" : "OFF";

  await fetch("/update-led", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ led: newState })
  });

  updateUI(newState);
}

function updateUI(state) {
  document.getElementById("status").innerText = state;
  const toggle = document.getElementById("toggle");
  toggle.className = state === "ON" ? "switch on" : "switch";
}

loadLED();
</script>
</body>
</html>
